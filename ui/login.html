<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trading" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body>
<!-- No tab bar here on purpose: signed out, none of those destinations work.
     The way out is the back link, which returns to the page that sent you. -->
<header class="topnav"><div class="topnav-inner">
  <a class="backlink" href="index.html" id="login-back" data-od-id="login-back"></a>
</div></header>

<main class="container section" id="content">
  <h1 data-i18n="login.title">Sign in</h1>
  <p class="body-muted" data-i18n="login.subtitle">Agentic Trading · personal console</p>

  <form id="login-form" class="stack stack-4" style="margin-top:24px;">
    <label class="field"><span data-i18n="login.username">Username</span>
      <input class="input" name="username" value="owner" autocomplete="username" required maxlength="100" /></label>
    <label class="field"><span data-i18n="login.password">Password</span>
      <input class="input" type="password" name="password" autocomplete="current-password" required maxlength="1024" /></label>
    <button class="btn btn-green" type="submit" id="login-submit" data-i18n="login.submit">Sign in</button>
    <p id="login-result" class="body-sm" role="status" aria-live="polite"></p>
  </form>

  <p class="body-sm body-muted" style="margin-top:24px;" id="login-setup"></p>
  <p style="margin-top:12px;"><a class="linkish body-sm" href="index.html?demo=1" data-i18n="login.demo">View the demo instead</a></p>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
