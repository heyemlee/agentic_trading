<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/mark.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agentic Trading" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body class="login-page">
<main class="container section" id="content">
  <!-- Decoration that must never block the way in: if the sprites fail to load,
       pixel-office.js writes the reason into the caption and the form below is
       untouched. -->
  <figure class="login-office" id="login-office">
    <div class="login-office-frame">
      <canvas id="pixel-office" width="320" height="296" role="img"
              aria-label="Research room illustration"></canvas>
      <div id="ambient-bubbles" class="login-office-bubbles" aria-hidden="true"></div>
    </div>
  </figure>

  <h1>Sign in</h1>

  <!-- POST is the native fallback when login.js has not loaded. FastAPI expects JSON and
       will reject the form body, but the password stays out of the URL, browser history and
       access log. login.js prevents this submission and sends the supported JSON request. -->
  <form id="login-form" method="post" action="/auth/login"
        class="stack stack-4" style="margin-top:24px;">
    <label class="field"><span>Username</span>
      <input class="input" name="username" value="owner" autocomplete="username" required maxlength="100" /></label>
    <label class="field"><span>Password</span>
      <input class="input" type="password" name="password" autocomplete="current-password" required maxlength="1024" /></label>
    <button class="btn btn-green" type="submit" id="login-submit">Sign in</button>
    <p id="login-result" class="body-sm" role="status" aria-live="polite"></p>
  </form>

  <p style="margin-top:12px;"><a class="linkish body-sm" href="index.html?demo=1">View the demo instead</a></p>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/login.js"></script>
<script src="assets/lab/pixel-office.js"></script>
<script src="assets/lab/login-office.js"></script>
</body>
</html>
