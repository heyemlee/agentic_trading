<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trading" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body>

<main id="content" hidden data-i18n-title="rs.title">

  <section class="section pagehead" data-od-id="pagehead">
    <div class="container">
      <h1 data-i18n="rs.title">Research</h1>
    </div>
  </section>

  <!-- ── decision strength ─────────────────────────────────────────── -->
  <section class="section" style="padding-top:0;" data-od-id="confidence-chart">
    <div class="container">
      <div class="card">
        <div class="row-between row-wrap" style="margin-bottom:16px;">
          <p class="eyebrow" data-i18n="rs.floorChart">Decision strength against the trading floor</p>
          <span class="chip" data-i18n="rs.floor">Floor 50</span>
        </div>
        <div id="conf-chart"></div>
      </div>
    </div>
  </section>

  <!-- ── run history ───────────────────────────────────────────────── -->
  <section class="section" data-od-id="run-history">
    <div class="container">
      <div class="section-head"><h2 data-i18n="rs.runs">Runs</h2></div>
      <div class="tabs" data-tabs role="tablist" aria-label="Filter runs">
          <button class="tab" role="tab" id="tab-runs-all"      aria-controls="panel-runs-all"      aria-selected="true" data-i18n="common.all">All</button>
          <button class="tab" role="tab" id="tab-runs-notrade"  aria-controls="panel-runs-notrade"  aria-selected="false" data-i18n="rs.noTrade">No trade</button>
          <button class="tab" role="tab" id="tab-runs-proposal" aria-controls="panel-runs-proposal" aria-selected="false" data-i18n="rs.proposed">Proposed</button>
        </div>
      <div class="tabpanel" role="tabpanel" id="panel-runs-all" aria-labelledby="tab-runs-all"></div>
      <div class="tabpanel" role="tabpanel" id="panel-runs-notrade" aria-labelledby="tab-runs-notrade" hidden></div>
      <div class="tabpanel" role="tabpanel" id="panel-runs-proposal" aria-labelledby="tab-runs-proposal" hidden></div>
    </div>
  </section>

  <!-- ── most recent decision ──────────────────────────────────────── -->
  <section class="section" data-od-id="run-detail">
    <div class="container">
      <h2 style="margin-bottom:8px;" data-i18n="rs.recent">Most recent decision</h2>
      <div class="card" id="recent-card"></div>
    </div>
  </section>

  <!-- ── start a run ───────────────────────────────────────────────── -->
  <section class="section" data-od-id="start-run">
    <div class="container grid-2-1">
      <div class="card">
        <h2 data-i18n="rs.ask">Ask for fresh research</h2>
        <p class="body-sm body-muted" style="margin-top:8px;" data-i18n="rs.askBody">
          Leave the date empty to use the latest completed market session.
        </p>
        <form id="run-form" style="margin-top:20px;">
          <div class="field"><label for="f-ticker" data-i18n="rs.ticker">Ticker</label>
            <input class="input" id="f-ticker" value="VTI" required pattern="[A-Za-z.\-]{1,10}" autocomplete="off" /></div>
          <details class="app-disclosure advanced-settings"><summary data-i18n="ux.advanced">Advanced settings</summary>
          <div class="grid-2" style="gap:16px;">
            <div class="field">
              <label for="f-bucket" data-i18n="rs.bucket">Bucket</label>
              <select class="select" id="f-bucket">
                <option value="core" data-i18n="bucket.core">Core</option>
                <option value="sandbox" data-i18n="bucket.sandbox">Sandbox</option>
                <option value="micro_live" selected data-i18n="bucket.micro_live">Micro-Live</option>
              </select>
            </div>
            <div class="field">
              <label for="f-instrument" data-i18n="rs.instrument">Instrument</label>
              <select class="select" id="f-instrument">
                <option value="etf">ETF</option>
                <option value="stock" data-i18n="rs.stock">Stock</option>
                <option value="auto" selected data-i18n="rs.autoDetect">Auto-detect</option>
              </select>
            </div>
            <div class="field">
              <label for="f-date" data-i18n="rs.tradeDate">Trade date</label>
              <input class="input" id="f-date" type="date" />
            </div>
          </div>
          <div class="field" style="margin-top:16px;">
            <label for="f-trigger" data-i18n="rs.trigger">Trigger</label>
            <select class="select" id="f-trigger">
              <option value="manual" selected data-i18n="rs.trgManual">Manual</option>
              <option value="scheduled" data-i18n="rs.trgScheduled">Scheduled</option>
              <option value="event" data-i18n="rs.trgEvent">Event</option>
              <option value="reanalysis" data-i18n="rs.trgReanalysis">Reanalysis</option>
            </select>
          </div>
          </details>
          <p id="run-scope" class="body-sm body-muted" style="margin-top:12px"></p>
          <p class="body-sm body-muted" style="margin-top:12px;" id="run-hint"></p>
          <button class="btn btn-primary" type="submit" style="margin-top:16px;" data-od-id="cta-start-run" data-i18n="rs.start">Start the run</button>
        </form>
        <div id="run-progress"></div>
      </div>

    </div>
  </section>

</main>

<dialog class="sheet" id="trace-sheet" data-od-id="trace-sheet">
  <div class="sheet-inner">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-scroll">
      <div class="trace-head" id="trace-head"></div>
      <div id="trace-steps"></div>
    </div>
    <button class="btn btn-secondary" id="trace-close" style="margin-top:16px;" data-i18n="common.close">Close</button>
  </div>
</dialog>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/pages/research.js"></script>
</body>
</html>
