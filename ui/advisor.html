<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>投资助手 · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
<link rel="stylesheet" href="assets/advisor.css" />
</head>
<body class="advisor-page">
<main id="content" hidden data-i18n-title="ai.title">
  <section class="section pagehead"><div class="container">
    <h1 data-i18n="ai.title">投资助手</h1>
    <p class="body-muted" data-i18n="ai.intro">从你的持仓和计划出发，讨论下一步。</p>
    <div class="assistant-shortcuts" role="tablist" aria-label="Assistant">
      <button class="btn btn-secondary btn-sm" id="view-chat" role="tab" aria-selected="true" aria-controls="panel-chat" data-i18n="app.chat">聊天</button>
      <button class="btn btn-secondary btn-sm" id="view-discover" role="tab" aria-selected="false" aria-controls="panel-discover" tabindex="-1" data-i18n="app.discover">选股</button>
    </div>
    <a class="body-sm linkish" href="research.html" data-i18n="nav.hint.research">完整研究与 Agent 报告</a>
    <p id="advisor-status" class="body-sm" role="status" aria-live="polite"></p>
  </div></section>
  <section class="section" style="padding-top:0"><div class="container advisor-layout">
    <div class="stack stack-4">
      <div class="card" id="panel-chat" role="tabpanel" aria-labelledby="view-chat">
        <div class="chat-toolbar">
          <button class="history-control" data-open-sheet="conversation-sheet" aria-haspopup="dialog"><span class="mini-orb" data-icon="history" aria-hidden="true"></span><span id="conversation-label" data-i18n="ai.history">历史对话</span><span class="ux-chevron"></span></button>
          <div class="chat-tools">
          <button class="circle-control" data-open-sheet="personal-sheet" data-i18n-aria="ai.personal" aria-label="My personal context" data-icon="personal"></button>
          <button class="circle-control" data-open-sheet="jobs-sheet" data-i18n-aria="ux.activity" aria-label="Activity" data-icon="activity"></button>
          <button id="new-conversation" class="circle-control" data-i18n-aria="ai.new" aria-label="New conversation" data-icon="plus"></button>
          </div>
        </div>
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
        <div class="advisor-actions">
          <button class="btn btn-secondary btn-sm" id="ask-risk" data-i18n="ai.askRisk">我的持仓有哪些风险？</button>
          <button class="btn btn-secondary btn-sm" id="ask-scenario" data-i18n="ai.askScenario">如果股票跌 5% 呢？</button>
        </div>
        <form id="chat-form">
          <label for="chat-input" class="sr-only" data-i18n="ai.message">你的问题</label>
          <textarea id="chat-input" class="form-input" rows="2" maxlength="4000" data-i18n-ph="ai.message" required></textarea>
          <button id="chat-send" class="btn btn-green" type="submit" data-i18n="ai.send">发送</button>
        </form>
        <p class="body-sm body-muted" data-i18n="ai.chatNote">回答会使用已保存的投资档案、持仓和研究记录。正式买卖仍从研究页进入审批。</p>
      </div>
    </div>
    <div class="stack stack-4">
      <div class="card" id="panel-discover" role="tabpanel" aria-labelledby="view-discover" hidden>
        <h2 data-i18n="ai.candidates">值得研究的候选</h2>
        <p class="body-sm body-muted" data-i18n="ai.sources">来自你的 Robinhood 自选、已保存的筛选器，以及现有 ETF 投资范围。按个人适合度筛选。</p>
        <button id="shortlist" class="btn btn-green" data-i18n="ai.shortlist">帮我筛选候选</button>
        <form id="symbol-form" class="symbol-search">
          <label for="symbol-input" class="sr-only" data-i18n="ai.symbol">或输入股票 / ETF 代码</label>
          <span class="search-lens" aria-hidden="true"></span>
          <input id="symbol-input" class="form-input" maxlength="20" data-i18n-ph="ux.search" placeholder="Search a symbol" required />
          <button class="search-submit" type="submit" data-i18n="ux.review">研究</button>
        </form>
        <div id="candidate-list" class="candidate-list"></div>
        <div id="holding-decisions"></div>
      </div>
      <div id="panel-personal" class="utility-section">
        <button class="utility-card" data-open-sheet="personal-sheet"><span class="utility-orb" data-icon="personal" aria-hidden="true"></span><span class="utility-copy"><strong data-i18n="ai.personal">我的个人情况</strong><span id="notes-preview" data-i18n="ux.personalHint">目标、期限与偏好</span></span><span class="ux-chevron"></span></button>
      </div>
      <div class="utility-section">
        <button class="utility-card" data-open-sheet="jobs-sheet"><span class="utility-orb" data-icon="activity" aria-hidden="true"></span><span class="utility-copy"><strong data-i18n="ux.activity">任务动态</strong><span id="jobs-preview"></span></span><span id="jobs-count" class="count-bubble">0</span><span class="ux-chevron"></span></button>
      </div>
      <details class="card app-disclosure" id="panel-tools" hidden>
        <summary data-i18n="ai.reuse">Robinhood 已有工具</summary>
        <p class="body-sm body-muted" data-i18n="ai.alertHint">高低点、价格和指标提醒直接在 Robinhood 设置。触发后，可以在这里重新研究。</p>
        <p><a href="https://robinhood.com/us/en/support/articles/stock-price-alerts/" target="_blank" rel="noopener noreferrer" data-i18n="ai.alerts">价格与指标提醒</a></p>
        <p><a href="https://robinhood.com/us/en/support/articles/stock-screeners/" target="_blank" rel="noopener noreferrer" data-i18n="ai.screeners">设置 Robinhood 筛选器</a></p>
      </details>
    </div>
  </div></section>
</main>
<dialog id="conversation-sheet" class="glass-sheet" data-sheet aria-labelledby="conversation-title">
  <div class="sheet-grip"></div><div class="glass-sheet-head"><h2 id="conversation-title" data-i18n="ai.history">历史对话</h2><button class="circle-control" data-close-sheet="conversation-sheet" data-i18n-aria="common.close" aria-label="Close" data-icon="cross"></button></div>
  <div id="conversations" class="conversation-options"></div>
</dialog>
<dialog id="personal-sheet" class="glass-sheet" data-sheet aria-labelledby="personal-title">
  <div class="sheet-grip"></div><div class="glass-sheet-head"><h2 id="personal-title" data-i18n="ai.personal">我的个人情况</h2><button class="circle-control" data-close-sheet="personal-sheet" data-i18n-aria="common.close" aria-label="Close" data-icon="cross"></button></div>
  <p class="sheet-description" data-i18n="ai.notesHint">补充目标、用钱时间和沟通偏好。</p>
  <label for="personal-notes" class="editor-label" data-i18n="ux.personalHint">目标、期限与偏好</label>
  <textarea id="personal-notes" class="glass-editor" rows="6" maxlength="4000" data-i18n-ph="ux.notesExample"></textarea>
  <p id="notes-save-status" class="editor-status" role="status"></p>
  <p class="sheet-fineprint" data-i18n="ai.notesBoundary">不会修改交易权限或风控参数。</p>
  <button id="save-notes" class="btn btn-green sheet-primary" data-i18n="ai.save">保存</button>
</dialog>
<dialog id="jobs-sheet" class="glass-sheet" data-sheet aria-labelledby="jobs-title">
  <div class="sheet-grip"></div><div class="glass-sheet-head"><h2 id="jobs-title" data-i18n="ux.activity">任务动态</h2><button class="circle-control" data-close-sheet="jobs-sheet" data-i18n-aria="common.close" aria-label="Close" data-icon="cross"></button></div>
  <div id="advisor-jobs" class="task-timeline"></div>
</dialog>
<dialog id="decision-sheet" class="glass-sheet" data-sheet aria-labelledby="decision-title">
  <div class="sheet-grip"></div><div class="glass-sheet-head"><h2 id="decision-title" data-i18n="ux.researchDetail">研究详情</h2><button class="circle-control" data-close-sheet="decision-sheet" data-i18n-aria="common.close" aria-label="Close" data-icon="cross"></button></div>
  <div id="decision-detail"></div>
</dialog>
<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/advisor-session.js"></script>
<script src="assets/pages/advisor.js"></script>
</body>
</html>
