<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity · Conservative Trading</title>
<link rel="stylesheet" href="assets/console.css" />
</head>
<body>

<main id="content" hidden data-i18n-title="ac.title">

  <section class="section pagehead" data-od-id="pagehead">
    <div class="container">
      <h1 data-i18n="ac.title">Activity</h1>
    </div>
  </section>

  <section class="section" style="padding-top:0;" data-od-id="orders">
    <div class="container grid-2">
      <div class="card" data-od-id="fills">
        <div class="section-head"><h2 data-i18n="ac.fills">Recorded fills</h2>
          <span class="chip" id="fill-count">—</span>
        </div>
        <div id="fills-body"></div>
      </div>
      <div class="card" data-od-id="open-orders">
        <div class="section-head">
          <h2 data-i18n="ac.open">Open at the venue</h2>
          <span class="chip" id="open-count">—</span>
        </div>
        <div id="open-body"></div>
      </div>
    </div>
  </section>

  <section class="section" data-od-id="tracked-orders">
    <div class="container">
      <div class="section-head"><h2>Order tracking / 订单追踪</h2></div>
      <p class="body-sm body-muted">Local record · Check synchronization time and any errors. / 本地记录，请核对同步时间与错误。</p>
      <div class="card list" id="tracked-body"></div>
    </div>
  </section>

  <section class="section" data-od-id="audit">
    <div class="container">
      <div class="section-head">
        <h2 data-i18n="ac.audit">Audit trail</h2></div>
      <div class="tabs" data-tabs role="tablist" aria-label="Filter the audit trail">
          <button class="tab" role="tab" id="tab-audit-all"       aria-controls="panel-audit-all"       aria-selected="true" data-i18n="ac.everything">Everything</button>
          <button class="tab" role="tab" id="tab-audit-decisions" aria-controls="panel-audit-decisions" aria-selected="false" data-i18n="ac.decisions">Decisions</button>
          <button class="tab" role="tab" id="tab-audit-proposals" aria-controls="panel-audit-proposals" aria-selected="false" data-i18n="ac.proposals">Proposals</button>
        </div>
      <div class="card">
        <div class="tabpanel" role="tabpanel" id="panel-audit-all" aria-labelledby="tab-audit-all"></div>
        <div class="tabpanel" role="tabpanel" id="panel-audit-decisions" aria-labelledby="tab-audit-decisions" hidden></div>
        <div class="tabpanel" role="tabpanel" id="panel-audit-proposals" aria-labelledby="tab-audit-proposals" hidden></div>
      </div>
    </div>
  </section>

</main>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/pages/activity.js"></script>
</body>
</html>
