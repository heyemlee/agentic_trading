<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Activity · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/mark.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agentic Trading" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body class="theme-mono">

<main id="content" hidden data-i18n-title="ac.title">

  <section class="section pagehead" data-od-id="pagehead">
    <div class="container">
      <h1 data-i18n="ac.title">Activity</h1>
      <p data-i18n="more.activityHint">Recorded fills and orders open at the venue</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;" data-od-id="orders">
    <div class="container">
      <div class="card" data-od-id="fills">
        <div class="section-head"><h2 data-i18n="ac.fills">Recorded fills</h2>
          <span class="chip" id="fill-count">—</span>
        </div>
        <div id="fills-body"></div>
      </div>
    </div>
  </section>

  <section class="section" data-od-id="tracked-orders">
    <div class="container">
      <div class="section-head"><h2 data-i18n="ux.tracking">Order tracking</h2></div>
      <p class="body-sm body-muted" data-i18n="ux.trackingNote">Local record · Check synchronization time and any errors.</p>
      <div class="card list" id="tracked-body"></div>
    </div>
  </section>

  <section class="section" data-od-id="audit">
    <div class="container">
      <div class="section-head">
        <h2 data-i18n="ac.audit">Audit trail</h2>
        <span class="chip" id="audit-scope">—</span>
      </div>
      <div class="row row-wrap" style="margin-bottom:12px;" id="audit-filters"></div>
      <div class="card">
        <div class="list list-inset" id="audit-list"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn btn-secondary btn-sm" type="button" id="audit-more"
                  data-od-id="cta-audit-more" hidden>—</button>
        </div>
        <p class="body-sm body-muted" style="margin-top:12px;" id="audit-note"></p>
      </div>
    </div>
  </section>

</main>

<script src="assets/press.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/pages/activity.js"></script>
</body>
</html>
