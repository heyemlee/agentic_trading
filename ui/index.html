<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Home · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/mark.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agentic Trading" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body class="home-page">

<main id="content" hidden data-i18n-title="home.title">

  <!-- ── waiting on you ────────────────────────────────────────────── -->
  <section class="section" style="padding-top:0;" data-od-id="needs-you">
    <div class="container" id="needs-you-slot"></div>
  </section>

  <!-- ── notices ───────────────────────────────────────────────────── -->
  <section class="section" style="padding-block:0;" data-od-id="warnings" id="home-warnings" hidden>
    <div class="container">
      <details class="home-notices">
        <summary><span data-i18n="home.notices">Notices</span> <span class="chip chip-warn" id="warn-count">—</span></summary>
        <div class="stack stack-3" id="warning-list"></div>
      </details>
    </div>
  </section>

  <!-- ── equity and high-water mark, for one account at a time ─────── -->
  <section class="section pagehead" style="padding-top:var(--space-4);" data-od-id="equity">
    <div class="container">
      <p class="eyebrow" id="equity-label">Equity</p>
      <p class="figure figure-lg" style="margin-top:8px;" id="equity-value">—</p>
      <p class="body-sm body-muted" style="margin-top:4px;" id="equity-source">—</p>

      <p class="body-sm" id="home-drawdown"></p>
      <div class="row row-wrap" style="margin-top:8px;">
        <span class="chip" id="chip-system">—</span>
        <span class="chip" id="chip-market">—</span>
        <span class="chip" id="chip-money">—</span>
      </div>

      <div class="app-quick-actions">
        <a class="btn btn-green" href="advisor.html" data-i18n="app.ask">问问助手</a>
        <a class="btn btn-secondary" href="portfolio.html" data-i18n="nav.portfolio">资产</a>
      </div>
      <details class="app-disclosure">
      <summary data-i18n="app.details">账户明细</summary>
      <div class="hwm" data-od-id="high-water-mark">
        <p class="hwm-delta" id="hwm-delta">—</p>
        <div class="hwm-track" id="hwm-track" role="img" aria-label="">
          <div class="hwm-fill" id="hwm-fill" style="width:0%"></div>
          <span class="hwm-mark" id="hwm-mark" style="left:0%"></span>
        </div>
        <p class="hwm-foot" id="hwm-foot">—</p>
      </div>

      <dl class="kv" style="margin-top:16px;" id="funding-kv"></dl>
      <div class="list" style="margin-top:16px;" id="account-list"></div>
      </details>
    </div>
  </section>

  <!-- ── what the agent is doing ───────────────────────────────────── -->
  <section class="section" style="padding-block:0;" data-od-id="agent">
    <div class="container">
      <a class="agent-strip" id="agent-link" href="lab.html">
        <span class="agent-dot" id="agent-dot"></span>
        <div>
          <p class="agent-state" id="agent-state">—</p>
          <p class="agent-note" id="agent-note"></p>
        </div>
        <span class="body-sm" data-i18n="home.viewProcess">查看过程</span>
      </a>
    </div>
  </section>

  <!-- ── latest ────────────────────────────────────────────────────── -->
  <section class="section" data-od-id="latest">
    <div class="container">
      <h2 style="margin-bottom:8px;" data-i18n="home.latest">Latest</h2>
      <div class="list" id="latest-list"></div>
    </div>
  </section>


</main>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/pages/index.js"></script>
</body>
</html>
