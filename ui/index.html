<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Home · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/mark.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agentic Trading" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body class="home-page">

<main id="content" hidden data-i18n-title="home.title">

  <!-- ── today: what needs you, what is not normal, what research found ─────────────── -->
  <section class="section pagehead" data-od-id="today">
    <div class="container">
      <h1 data-i18n="home.today">Today</h1>
      <p class="body-sm body-muted" id="today-date"></p>
    </div>
  </section>

  <section class="section home-attention" id="home-attention" data-od-id="needs-you" aria-labelledby="attention-heading" hidden>
    <div class="container" id="needs-you-slot"></div>
  </section>

  <!-- Only what is not normal. What is normal and unchanging has its own page. -->
  <section class="section home-conditions" id="home-conditions" data-od-id="conditions" hidden>
    <div class="container"><div class="list" id="conditions-list"></div></div>
  </section>

  <section class="section" data-od-id="research">
    <div class="container">
      <div class="section-head"><h2 data-i18n="nav.research">Research</h2>
        <a class="body-sm" href="lab.html" data-i18n="common.all">All</a></div>
      <div class="list" id="research-list"></div>
      <p class="body-sm body-muted" id="research-next"></p>
    </div>
  </section>


</main>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/pages/index.js"></script>
</body>
</html>
