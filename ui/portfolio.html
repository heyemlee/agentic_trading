<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Trading" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body>

<main id="content" hidden data-i18n-title="pf.title">

  <section class="section pagehead" data-od-id="pagehead">
    <div class="container">
      <h1 data-i18n="pf.title">Portfolio</h1>
      <p class="figure figure-lg" style="margin-top:12px;" id="pf-total">—</p>
      <p class="body-sm body-muted" style="margin-top:6px;" id="pf-asof"></p>
    </div>
  </section>

  <section class="section" style="padding-top:0;" data-od-id="accounts">
    <div class="container stack stack-4" id="account-cards"></div>
  </section>

  <section class="section" style="padding-top:0;" data-od-id="allocation">
    <div class="container">
      <div class="card">
        <p class="eyebrow" data-i18n="pf.allocation">Allocation across buckets</p>
        <div class="sleeve" style="margin-top:12px;" id="alloc-bar" aria-hidden="true"></div>
        <div class="list list-inset" style="margin-top:8px;" id="alloc-legend"></div>
      </div>
    </div>
  </section>

  <section class="section" data-od-id="buckets">
    <div class="container stack stack-4" id="bucket-cards"></div>
  </section>

</main>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/pages/portfolio.js"></script>
</body>
</html>
