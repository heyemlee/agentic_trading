<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Risk · Agentic Trading</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/mark.svg" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agentic Trading" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="assets/console.css" />
</head>
<body class="theme-mono">

<main id="content" hidden data-i18n-title="rk.title">

  <section class="section pagehead" data-od-id="pagehead">
    <div class="container">
      <h1 data-i18n="rk.title">Risk</h1>
      <p data-i18n="more.riskHint">Market regime, limits and whether new positions may open</p>
    </div>
  </section>

  <!-- ── market regime ─────────────────────────────────────────────── -->
  <section class="section" style="padding-top:0;" data-od-id="regime">
    <div class="container">
      <div class="card">
        <div class="row-between row-wrap" style="margin-bottom:16px;">
          <div>
            <p class="eyebrow" data-i18n="rk.regime">Market regime</p>
            <p class="figure figure-sm" style="margin-top:4px;" id="regime-level">—</p>
          </div>
          <span class="chip" id="regime-chip">—</span>
        </div>

        <div style="margin-top:8px;" data-od-id="regime-index">
          <div class="row-between body-sm" style="margin-bottom:6px;">
            <span class="body-muted" id="spy-label">—</span>
            <span class="num" id="spy-delta">—</span>
          </div>
          <div class="meter-track" style="height:10px;">
            <div class="meter-fill is-accent" id="spy-bar" style="width:0%"></div>
          </div>
        </div>

        <div style="margin-top:16px;" data-od-id="regime-vix">
          <div class="row-between body-sm" style="margin-bottom:6px;">
            <span class="body-muted" data-i18n="rk.vix">^VIX</span>
            <span class="num" id="vix-value">—</span>
          </div>
          <div class="meter-track" style="height:10px;">
            <div class="meter-fill" id="vix-bar" style="width:0%"></div>
          </div>
        </div>

        <p class="body-sm body-muted" style="margin-top:16px;" id="regime-detail"></p>
      </div>
    </div>
  </section>

  <!-- ── ladders ───────────────────────────────────────────────────── -->
  <section class="section" data-od-id="ladders">
    <div class="container">
      <div class="section-head"><h2 data-i18n="rk.ladders">Drawdown ladders</h2>
        <span class="chip" id="ladder-summary">—</span>
      </div>
      <div class="grid-2" id="ladder-cards"></div>
    </div>
  </section>

  <!-- ── preflight ─────────────────────────────────────────────────── -->
  <section class="section" id="preflight" data-od-id="preflight">
    <div class="container">
      <div class="section-head">
        <h2 data-i18n="rk.preflight">Real-money preflight</h2></div>
      <div class="tabs" data-tabs role="tablist" aria-label="Filter gates">
          <button class="tab" role="tab" id="tab-gates-all"      aria-controls="panel-gates-all"      aria-selected="true" data-i18n="common.all">All</button>
          <button class="tab" role="tab" id="tab-gates-blocking" aria-controls="panel-gates-blocking" aria-selected="false" data-i18n="rk.blocking">Blocking</button>
          <button class="tab" role="tab" id="tab-gates-green"    aria-controls="panel-gates-green"    aria-selected="false" data-i18n="rk.green">Green</button>
        </div>

      <div class="grid-2-1">
        <div class="card">
          <div class="tabpanel" role="tabpanel" id="panel-gates-all" aria-labelledby="tab-gates-all"></div>
          <div class="tabpanel" role="tabpanel" id="panel-gates-blocking" aria-labelledby="tab-gates-blocking" hidden></div>
          <div class="tabpanel" role="tabpanel" id="panel-gates-green" aria-labelledby="tab-gates-green" hidden></div>
        </div>

        <div class="stack stack-4">
          <div class="card card-real" data-od-id="capital-boundary">
            <span class="chip chip-accent" data-i18n="rk.boundary">Capital boundary</span>
            <p class="figure" style="margin-top:12px;" id="boundary-value">—</p>
            <dl class="kv" style="margin-top:16px;">
              <div class="kv-row"><dt data-i18n="rk.account">Account</dt><dd id="acct-masked">—</dd></div>
              <div class="kv-row"><dt data-i18n="rk.cashEquity">Cash · equity</dt><dd id="acct-cash">—</dd></div>
              <div class="kv-row"><dt data-i18n="rk.buyingPower">Buying power</dt><dd id="acct-bp">—</dd></div>
              <div class="kv-row"><dt data-i18n="rk.executionMode">Execution mode</dt><dd id="acct-mode">—</dd></div>
            </dl>
          </div>

          <div class="card card-quiet" data-od-id="permissions">
            <p class="eyebrow" data-i18n="rk.permissions">Venue permissions</p>
            <dl class="kv" style="margin-top:8px;" id="permission-list"></dl>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="assets/i18n.js"></script>
<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/console.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/pages/risk.js"></script>
</body>
</html>
