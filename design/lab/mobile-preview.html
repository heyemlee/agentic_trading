<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>研究室 · 手机端预览</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#e9ece5;color:#26352d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:30px}
    main{display:grid;justify-items:center;gap:14px}.preview-head{width:min(390px,calc(100vw - 24px));display:flex;justify-content:space-between;align-items:baseline}
    h1{font-size:16px;margin:0;font-weight:600}.size{font:12px ui-monospace,monospace;color:#69756d}
    .phone{width:390px;max-width:calc(100vw - 24px);height:min(844px,calc(100vh - 100px));padding:8px;border-radius:34px;background:#1f2823;box-shadow:0 22px 70px #26352d2b}
    iframe{display:block;width:100%;height:100%;border:0;border-radius:27px;background:#f4f3ee}
    @media(max-width:430px){body{padding:0}.preview-head{display:none}.phone{width:100vw;max-width:none;height:100vh;padding:0;border-radius:0;box-shadow:none}.phone iframe{border-radius:0}}
  </style>
</head>
<body>
  <main>
    <div class="preview-head"><h1>研究室 · 手机端</h1><span class="size">390 × 844</span></div>
    <div class="phone"><iframe src="./" title="研究室手机端交互预览"></iframe></div>
  </main>
</body>
</html>
